<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freestyle Rhyme Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap">
<meta name="description" content="Practice freestyle rap: pick a rhyme scheme, upload a beat, and spit 32 bars with rhyme words landing on the beat. Beat detection runs in your browser.">
<meta property="og:title" content="freestyle.wtf">
<meta property="og:description" content="Pick a rhyme scheme, upload a beat, and spit 32 bars with rhyme words landing on the beat.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="freestyle.wtf">
<meta property="og:url" content="https://freestyle.wtf/">
<meta property="og:image" content="https://freestyle.wtf/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="freestyle.wtf: a 4-bar grid with rhyme words landing on beat 4">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://freestyle.wtf/og-image.png">
<style>
/* Spotify palette. #191414 is the brand black from developer.spotify.com/documentation/design (fallback
   background for playback views); the rest are the Spotify web player's UI tokens. */
:root{
  --base:#000000;--bg:#121212;--surface:#181818;--elev:#1f1f1f;--high:#282828;--high-hover:#3e3e3e;--player:#191414;
  --border:#4d4d4d;--border-soft:rgba(255,255,255,.1);--outline:#7c7c7c;
  --text:#ffffff;--meta:#cbcbcb;--muted:#b3b3b3;--subdued:#7c7c7c;
  --green:#1ed760;--green-hover:#1db954;--on-accent:#000000;--focus:rgba(30,215,96,.4);
  --warn:#ffa42b;--danger:#f3727f;--blue:#539df5;
  --top-h:56px;
  --ease:cubic-bezier(.77,0,.18,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:"Fraunces",Georgia,'Times New Roman',serif;font-optical-sizing:auto;color:var(--text);
  cursor:default;-webkit-user-select:none;user-select:none;}   /* no text cursor or selection on any text */
input[type="text"],input:not([type]),textarea{cursor:text;-webkit-user-select:text;user-select:text;}
body.lock{overflow:hidden;}
button,input{font-family:inherit;}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--green);outline-offset:2px;}
.root{background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
.topbar{height:var(--top-h);flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 20px;}
.brand{font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--text);text-decoration:none;line-height:1;font-variation-settings:"opsz" 144;}
.brand .tld{color:var(--green);}
.brand:hover .tld{color:var(--green-hover);}
.main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
#setup-screen{width:100%;max-width:840px;margin:0 auto;padding-bottom:6px;}
.screen{display:none;flex-direction:column;}
.screen.active{display:flex;}
#setup-screen{transition:transform .65s var(--ease),filter .65s var(--ease);transform-origin:50% 0;}
.root.building #setup-screen,.root.sessioning #setup-screen{transform:scale(.96);filter:brightness(.45);}

.panel{background:var(--surface);border-radius:8px;padding:16px 18px;margin:0 14px 12px;}
.panel:first-child{margin-top:14px;}
.panel-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.panel-title{font-size:12px;letter-spacing:.12em;color:var(--text);font-weight:700;flex:1;}
.muted{font-size:11px;color:var(--muted);}
.lbl{font-size:10px;color:var(--muted);letter-spacing:.1em;margin-bottom:8px;}
.row-gap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px;}

.scheme-pills{display:flex;gap:8px;flex-wrap:wrap;}
.spill{background:var(--high);border-radius:500px;padding:7px 16px;font-size:13px;color:var(--text);cursor:pointer;transition:background .15s;font-weight:700;display:inline-flex;align-items:center;gap:8px;}
.spill:hover{background:var(--high-hover);}
.spill.sel{background:var(--green);color:var(--on-accent);}
.spill.more{background:var(--green);color:var(--on-accent);}
.spill.more:hover{background:var(--green-hover);}
/* scheme chips on the left, a fixed "Show words" cluster on the right, a divider that never moves; the extra
   schemes open in their own row below the chips */
#grid-panel{container-type:inline-size;}
.scheme-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:22px;align-items:start;margin-bottom:18px;}
.vis-col{border-left:1px solid var(--border-soft);padding-left:22px;align-self:stretch;}
.vis-col .vis-pills{flex-wrap:nowrap;}
.vis-col .vpill{flex:none;}
#syl-main{display:block;margin-top:10px;}
.vis-col.off{opacity:.35;pointer-events:none;}
.scheme-more:not(:empty){padding-top:8px;}
.saved-pills:not(:empty){margin-top:8px;}
.scheme-more.sizing{overflow:hidden;transition:height .45s var(--ease);}
@container (max-width:700px){
  .scheme-controls{grid-template-columns:1fr;row-gap:16px;}
  .vis-col{border-left:none;padding-left:0;border-top:1px solid var(--border-soft);padding-top:14px;}
  .vis-col .vis-pills{flex-wrap:wrap;}
}
.spill.pop-in{animation:chip-in .42s cubic-bezier(.2,.9,.3,1.1) backwards;}
.spill.pop-out{animation:chip-out .2s ease forwards;}
@keyframes chip-in{from{opacity:0;transform:scale(.6);filter:blur(6px);}}
@keyframes chip-out{to{opacity:0;transform:scale(.7);filter:blur(4px);}}
.spill .x{font-size:10px;opacity:.55;padding:0 2px;}
.spill .x:hover{opacity:1;}
.vis-pills{display:flex;gap:6px;flex-wrap:wrap;}
.vpill{background:var(--high);border:none;font-family:inherit;border-radius:500px;padding:7px 14px;font-size:12px;color:var(--text);cursor:pointer;transition:background .15s;flex:1;text-align:center;font-weight:700;white-space:nowrap;}
.vpill:hover{background:var(--high-hover);}
.vpill.sel{background:var(--green);color:var(--on-accent);}

.grid-wrap{position:relative;user-select:none;}
.beat-labels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:5px;}
.beat-lbl{text-align:center;font-size:11px;color:var(--muted);letter-spacing:.08em;font-weight:700;}
.bar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.gcell{height:62px;border-radius:8px;background:var(--elev);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;position:relative;}
.gcell.rc{background:var(--high);border:2px solid var(--gc);}
.gcell.rc.hid{border-style:dashed;}
.gcell.target{border:2px dashed var(--green);background:rgba(30,215,96,.06);}
/* presets: the rhyme column is its own layer above a full grid of empty boxes, so the boxes it leaves stay visible */
#grid-panel{position:relative;}
.rhyme-col{position:absolute;top:0;left:calc((100% - 21px) / 4 * var(--col) + 7px * var(--col));width:calc((100% - 21px) / 4);
  display:flex;flex-direction:column;gap:7px;z-index:2;cursor:grab;touch-action:none;will-change:transform;}
.rhyme-col.dragging{cursor:grabbing;}
.rhyme-col .gcell.rc{transition:box-shadow .25s,background .25s;}
.rhyme-col.dragging .gcell.rc{background:#2c2c2c;box-shadow:0 14px 30px rgba(0,0,0,.55);}
.rhyme-col .slot{visibility:hidden;}
.word-text{font-size:16px;font-weight:700;letter-spacing:.02em;text-align:center;padding:0 6px;color:var(--gc);}
.word-text.hidden-word{visibility:hidden;}
/* the drag hint hangs below the rhyme scheme panel, under the rhyme column, and fades away while you drag */
#grid-panel.has-hint{margin-bottom:70px;}
.col-hint{position:absolute;top:calc(100% + 16px);left:0;transform:translateX(-50%);display:flex;align-items:center;gap:12px;
  padding:10px 20px;border-radius:500px;background:var(--surface);border:1px solid rgba(30,215,96,.4);color:var(--text);
  font-size:14px;font-weight:700;letter-spacing:.24em;white-space:nowrap;cursor:grab;touch-action:none;user-select:none;
  box-shadow:0 0 0 5px rgba(30,215,96,.06),0 10px 26px rgba(0,0,0,.45);transition:opacity .28s ease,transform .28s ease;}
.col-hint::before{content:"";position:absolute;top:-6px;left:calc(50% + var(--tip,0px));width:10px;height:10px;background:var(--surface);
  border-left:1px solid rgba(30,215,96,.4);border-top:1px solid rgba(30,215,96,.4);transform:translateX(-50%) rotate(45deg);}
.col-hint .ar{color:var(--green);font-size:18px;letter-spacing:0;display:inline-block;animation:nudge 1.6s ease-in-out infinite;}
.col-hint .ar.l{--dir:-1;}
.col-hint .ar.r{--dir:1;}
@keyframes nudge{50%{transform:translateX(calc(var(--dir) * 5px));}}
.col-hint.away{opacity:0;transform:translateX(-50%) translateY(8px) scale(.9);pointer-events:none;}
.col-hint:hover{border-color:var(--green);}
.col-hint[hidden]{display:none;}

/* beat library */
.drop{border:2px dashed var(--border);border-radius:8px;padding:14px;text-align:center;background:var(--elev);transition:all .15s;}
.drop.over{border-color:var(--green);background:rgba(30,215,96,.08);}
.btn{background:transparent;border:1px solid var(--outline);border-radius:500px;padding:7px 14px;font-size:12px;color:var(--text);cursor:pointer;font-weight:700;transition:border-color .15s,background .15s,transform .15s;}
.btn:hover{border-color:var(--text);transform:scale(1.04);}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;border-color:var(--outline);}
.btn.go{background:var(--green);border-color:var(--green);color:var(--on-accent);}
.btn.go:hover{background:var(--green-hover);border-color:var(--green-hover);}
.btn.go:disabled{background:var(--green);border-color:var(--green);}
.btn.big{padding:12px 30px;font-size:14px;letter-spacing:.08em;}
.lib{margin-top:12px;max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:2px;}
.tabs{display:flex;gap:6px;}
.tab{background:var(--high);border:none;border-radius:500px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;transition:background .15s;}
.tab:hover{background:var(--high-hover);}
.tab[aria-selected="true"]{background:var(--green);color:var(--on-accent);}
.lempty{font-size:12px;color:var(--muted);padding:10px 2px;}
.lhdr{font-size:10px;letter-spacing:.1em;color:var(--muted);margin:8px 2px 4px;}
.lrow{display:flex;align-items:center;gap:10px;border-radius:6px;padding:9px 10px;cursor:pointer;transition:background .15s;}
.lrow:hover{background:var(--high);}
.lrow.sel{background:var(--high);}
.lrow.sel .lname{color:var(--green);}
.lname{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
.lmeta{font-size:11px;color:var(--muted);white-space:nowrap;}
.ldel{background:none;border:none;color:var(--subdued);font-size:14px;cursor:pointer;padding:2px 6px;}
.ldel:hover{color:var(--danger);}
.detail{margin-top:14px;border-top:1px solid var(--border-soft);padding-top:14px;}
.drow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.dlbl{font-size:10px;letter-spacing:.1em;color:var(--muted);width:78px;}
.bpmv{font-size:20px;font-weight:700;min-width:70px;text-align:center;color:var(--green);}
#detail.ro [data-act]{display:none;}
.dropv{font-size:13px;font-weight:700;min-width:118px;text-align:center;color:var(--warn);}
.dots{display:flex;gap:6px;margin-left:6px;}
.dot{width:14px;height:14px;border-radius:50%;background:var(--high);border:1.5px solid var(--border);}
.dot.on{background:var(--green);border-color:var(--green);}
.dot.on.one{background:var(--text);border-color:var(--text);}
canvas.gv{width:100%;height:78px;background:var(--bg);border:1px solid var(--border-soft);border-radius:8px;display:block;}
.note{font-size:11px;color:var(--muted);line-height:1.45;margin-top:8px;}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);cursor:pointer;}
.chk input{accent-color:var(--green);width:15px;height:15px;}

.play-btn{width:calc(100% - 28px);margin:4px 14px 14px;background:var(--green);color:var(--on-accent);border:none;border-radius:500px;padding:15px;font-size:15px;font-weight:700;letter-spacing:.1em;cursor:pointer;transition:background .15s,transform .15s;display:flex;align-items:center;justify-content:center;gap:9px;}
.play-btn:hover{background:var(--green-hover);transform:scale(1.02);}
.play-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

/* performance */
#perf-screen{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;background:var(--player);--inset:14px;
  clip-path:circle(0 at var(--ox,50%) var(--oy,100%));visibility:hidden;transition:clip-path .65s var(--ease),visibility 0s linear .65s;}
#perf-screen.open{clip-path:circle(150vmax at var(--ox,50%) var(--oy,100%));visibility:visible;transition:clip-path .65s var(--ease);}
#perf-screen.intro .rise{animation:rise .55s var(--ease) backwards;animation-delay:calc(.2s + var(--d,0) * 60ms);}
.perf-hdr{padding:14px var(--inset) 4px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.pname{font-size:16px;font-weight:700;color:var(--text);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stop-btn{background:transparent;border:1px solid var(--outline);border-radius:500px;padding:6px 14px;font-size:12px;color:var(--text);cursor:pointer;letter-spacing:.06em;white-space:nowrap;font-weight:700;transition:border-color .15s,transform .15s;}
.stop-btn:hover{border-color:var(--text);transform:scale(1.04);}
.stop-btn:disabled{opacity:.35;cursor:default;transform:none;}
.perf-actions{display:flex;gap:8px;flex-shrink:0;}
#pause-btn.on{border-color:var(--green);color:var(--green);}
#perf-screen .bars-scroll{transition:opacity .25s;}
#perf-screen.paused .bars-scroll{opacity:.45;}
.bars-scroll{overflow-y:auto;flex:1;min-height:0;padding:12px var(--inset) 20px;}
.bar-block{margin-bottom:10px;}
.bar-row-perf{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.pcell{height:64px;border-radius:8px;background:var(--elev);border:1px solid var(--border-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:background .1s,border-color .1s;}
.pcell .pword{font-size:13px;font-weight:700;color:transparent;text-align:center;padding:0 4px;line-height:1.2;}
.pcell.prep-cell{background:var(--surface);}
.pcell.rhyme-cell.upcoming{background:var(--high);border:2px solid var(--gc);}
.pcell.rhyme-cell.upcoming .pword{color:var(--gc);opacity:.5;}
/* the beat indicator lights the box's outline (border + glow) and never fills it, so a rhyme word stays readable */
.pcell{transition:background .1s,border-color .1s,box-shadow .12s;}
.pcell.current-beat{border:2px solid var(--green);box-shadow:0 0 0 3px rgba(30,215,96,.22),0 0 18px rgba(30,215,96,.35);}
.pcell.current-rhyme{background:var(--high);border:3px solid var(--gc);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 28%,transparent),0 0 22px color-mix(in srgb,var(--gc) 45%,transparent);}
.pcell.current-rhyme .pword{color:var(--gc);opacity:1;}
.pcell.played{background:var(--surface);border-color:transparent;}
.pcell.played .pword{color:var(--gc);opacity:.6;}

/* rhyme builder page */
.build{position:fixed;inset:0;z-index:50;overflow-y:auto;background:linear-gradient(180deg,rgba(30,215,96,.34) 0,rgba(18,18,18,0) 320px) var(--bg);
  clip-path:circle(0 at var(--ox,50%) var(--oy,0));visibility:hidden;transition:clip-path .65s var(--ease),visibility 0s linear .65s;}
.build.open{clip-path:circle(150vmax at var(--ox,50%) var(--oy,0));visibility:visible;transition:clip-path .65s var(--ease);}
.build-in{max-width:760px;margin:0 auto;padding:18px 14px 40px;}
.build.intro .rise{animation:rise .55s var(--ease) backwards;animation-delay:calc(.2s + var(--d,0) * 60ms);}
@keyframes rise{from{opacity:0;transform:translateY(16px);}}
.bhead{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.back{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:var(--text);font-size:17px;cursor:pointer;flex-shrink:0;transition:background .15s,transform .15s;}
.back:hover{background:rgba(0,0,0,.8);transform:scale(1.06);}
.beyebrow{font-size:10px;letter-spacing:.14em;color:var(--meta);font-weight:700;}
.btitle{font-size:30px;font-weight:700;line-height:1.1;}
.bhint{font-size:13px;color:var(--meta);line-height:1.45;min-height:38px;margin-bottom:14px;}
.bhint b{color:var(--ac);}
.bgrid-wrap{display:grid;grid-template-columns:44px 1fr;column-gap:7px;}
.bar-lbls{display:grid;grid-template-rows:repeat(4,70px);gap:7px;}
.bar-lbls div{display:flex;align-items:center;font-size:10px;letter-spacing:.08em;color:var(--muted);font-weight:700;}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.bcell{font:inherit;color:var(--text);height:70px;border-radius:8px;background:var(--elev);border:1px solid var(--border-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:background .15s,border-color .15s;user-select:none;}
.bgrid.intro .bcell{animation:pop .45s var(--ease) backwards;animation-delay:calc(.3s + var(--i) * 22ms);}
@keyframes pop{from{opacity:0;transform:scale(.85);}}
.bcell:hover{background:var(--high);}
.bcell:not(.on):hover::after{content:"+";font-size:24px;line-height:1;color:var(--ac);}
.bcell.on{background:var(--high);border:2px solid var(--gc);}
.bcell.hid{border-style:dashed;}
.bcell .bw{font-size:16px;font-weight:700;color:var(--gc);text-align:center;padding:0 4px;}
.bcell.hid .bw{opacity:.35;text-decoration:line-through;}
.bcell .btag{position:absolute;top:5px;left:7px;font-size:10px;font-weight:700;color:var(--gc);letter-spacing:.04em;}
.word-text.long,.bcell .bw.long{font-size:13px;}
.gsyl{font-size:10px;letter-spacing:.06em;color:var(--on-accent);background:var(--gc);border-radius:500px;padding:1px 6px;}
.btn.toggle[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--on-accent);}
.btn.feel[aria-pressed="true"]{border-color:var(--green);color:var(--green);}
.bcell .bstate{font-size:9px;color:var(--muted);letter-spacing:.08em;margin-top:3px;}
.bcell.bump{animation:bump .25s ease;}
@keyframes bump{50%{transform:scale(.93);}}
.groups{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px;}
.gchip{display:inline-flex;align-items:center;gap:8px;background:var(--high);border:2px solid transparent;border-radius:500px;padding:5px 6px 5px 12px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;transition:border-color .15s,background .15s;}
.gchip:hover{background:var(--high-hover);}
.gchip.act{border-color:var(--gc);}
.gdot{width:10px;height:10px;border-radius:50%;background:var(--gc);}
.gmeta{color:var(--muted);font-weight:400;}
.gx{background:none;border:none;color:var(--subdued);cursor:pointer;font-size:11px;padding:2px 6px;}
.gx:hover{color:var(--danger);}
.bactions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px;}
.bfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--border-soft);padding-top:18px;}
.name-in{flex:1;min-width:160px;background:var(--elev);border:1px solid var(--outline);border-radius:4px;padding:10px 12px;color:var(--text);font-size:13px;}
.name-in::placeholder{color:var(--subdued);}
.name-in:focus{outline:none;border-color:var(--text);box-shadow:0 0 0 3px var(--focus);}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--blue);color:var(--on-accent);font-size:13px;font-weight:700;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px);}
.toast.show{opacity:1;transform:translate(-50%,0);}
@media (max-width:480px){
  .bcell{height:60px;}.bar-lbls{grid-template-rows:repeat(4,60px);}.bgrid-wrap{grid-template-columns:36px 1fr;}
  .btitle{font-size:24px;}.bcell .bw{font-size:14px;}
}
/* phones: edge-to-edge content, compact top bar */
@media (max-width:640px){
  :root{--top-h:50px;}
  .topbar{padding:0 16px;}
  .brand{font-size:21px;}
  .col-hint{padding:8px 15px;font-size:12px;gap:9px;}
  .col-hint .ar{font-size:15px;}
}
/* full-size windows: two columns on setup, bigger grids, performance centred and filling the height */
@media (min-width:1000px){
  #setup-screen.active{display:grid;max-width:1440px;padding:20px 24px 24px;gap:16px;align-items:start;
    grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"scheme lib" "scheme play";grid-template-rows:auto 1fr;}
  #setup-screen .panel{margin:0;padding:20px 22px;}
  #grid-panel{grid-area:scheme;}
  #grid-panel.has-hint{margin-bottom:70px;}
  #lib-panel{grid-area:lib;}
  .play-btn{grid-area:play;align-self:start;width:100%;margin:0;padding:18px;font-size:16px;}
  .gcell{height:86px;}
  .word-text{font-size:20px;}
  .word-text.long{font-size:16px;}
  .lib{max-height:340px;}
  #perf-screen{--inset:max(24px,calc((100% - 1040px) / 2));}
  .perf-hdr{padding:18px var(--inset) 6px;}
  .bar-row-perf{gap:10px;}
  .pcell{height:88px;}
  .pcell .pword{font-size:19px;}
  .bar-block{margin-bottom:14px;}
  .build-in{max-width:1040px;padding:28px 24px 48px;}
  .bcell{height:88px;}
  .bar-lbls{grid-template-rows:repeat(4,88px);}
  .bcell .bw{font-size:19px;}
  .bcell .bw.long{font-size:16px;}
}
/* page-load intro: containers and buttons are carved out (their outline is drawn on, then they fill in), the small
   pieces assemble (fly in and lock into place), and all text writes itself in letter by letter: each letter's
   outline is stroked on, then filled with ink (the football explainer's writing animation) */
body.preintro .root{opacity:0;}
.notrans,.notrans *{transition:none!important;}
/* a 1px dot in the page colour: an early visible paint, so on refresh the browser drops the previous page at once
   instead of holding it on screen until the intro starts */
.paint-dot{position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;font-size:1px;line-height:1px;color:var(--bg);pointer-events:none;}
.carving{background-color:transparent!important;border-color:transparent!important;box-shadow:none!important;}
.carved{transition:background-color .45s ease,border-color .45s ease,box-shadow .45s ease!important;}
.carve-svg{position:absolute;pointer-events:none;overflow:visible;transition:opacity .4s ease;z-index:1;}
.carve-svg rect{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:var(--len) 100000;stroke-dashoffset:var(--len);
  animation:carve-draw .75s cubic-bezier(.6,.05,.3,1) forwards;animation-delay:var(--d);}
@keyframes carve-draw{to{stroke-dashoffset:0;}}
.carve-svg.done{opacity:0;}
.wipe{animation:wipe .9s cubic-bezier(.6,.05,.3,1) both;animation-delay:var(--d);}
@keyframes wipe{from{clip-path:inset(0 100% 0 0);}}
.assemble{animation:assemble .7s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:var(--d);}
@keyframes assemble{from{opacity:0;transform:translate(var(--ax),var(--ay)) rotate(var(--ar)) scale(.5);}}
.w{position:relative;display:inline-block;}
.w.writing>.wt{color:transparent;}
.w>svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
.w text{fill:transparent;stroke:currentColor;stroke-width:1.1px;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:var(--len) 100000;stroke-dashoffset:var(--len);
  animation:letter-draw .575s cubic-bezier(.5,.1,.3,1) forwards,letter-ink .375s ease forwards;animation-delay:var(--d),calc(var(--d) + 240ms);}
@keyframes letter-draw{to{stroke-dashoffset:0;}}
@keyframes letter-ink{to{fill:currentColor;stroke-width:0;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

<script>
/* ================= AUDIO + BEAT ANALYSIS ================= */
const FFT_N=1024, DELTA=0.0;      // DELTA calibrated against synthetic tests
const PRIOR_CENTER=120, PRIOR_SIGMA=0.6, ALPHA=0.5;
let AC=null;
function getCtx(){
  if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended") AC.resume();
  return AC;
}

const FFT={n:FFT_N,rev:null,cos:null,sin:null,win:null};
(function(){
  const n=FFT_N;
  FFT.rev=new Uint16Array(n);
  const bits=Math.log2(n);
  for(let i=0;i<n;i++){let r=0;for(let b=0;b<bits;b++) if(i&(1<<b)) r|=1<<(bits-1-b);FFT.rev[i]=r;}
  FFT.cos=new Float32Array(n/2);FFT.sin=new Float32Array(n/2);
  for(let i=0;i<n/2;i++){FFT.cos[i]=Math.cos(2*Math.PI*i/n);FFT.sin[i]=-Math.sin(2*Math.PI*i/n);}
  FFT.win=new Float32Array(n);
  for(let i=0;i<n;i++) FFT.win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(n-1));
})();
function fft(re,im){
  const n=FFT_N,rev=FFT.rev;
  for(let i=0;i<n;i++){const j=rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t;}}
  for(let size=2;size<=n;size<<=1){
    const half=size>>1,step=n/size;
    for(let i=0;i<n;i+=size){
      for(let j=0,k=0;j<half;j++,k+=step){
        const wr=FFT.cos[k],wi=FFT.sin[k];
        const a=i+j,b=a+half;
        const tr=re[b]*wr-im[b]*wi,ti=re[b]*wi+im[b]*wr;
        re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;
      }
    }
  }
}

function combSum(o,period,phase){
  let s=0,c=0;const L=o.length-1;
  for(let t=phase;t<L;t+=period){const i=t|0,f=t-i;s+=o[i]*(1-f)+o[i+1]*f;c++;}
  return c?s/Math.pow(c,ALPHA):0;
}
function prior(bpm){const x=Math.log2(bpm/PRIOR_CENTER)/PRIOR_SIGMA;return Math.exp(-0.5*x*x);}

function bestPhase(o,fps,bpm,fine){
  const p=60/bpm*fps;let bs=-1,bp=0;
  const step=fine?0.25:1;
  for(let ph=0;ph<p;ph+=step){const sc=combSum(o,p,ph);if(sc>bs){bs=sc;bp=ph;}}
  return {ph:bp,score:bs};
}

function pickDownbeat(o,low,fps,bpm,ph){
  const p=60/bpm*fps;
  const sums=[0,0,0,0],cnt=[0,0,0,0];
  let k=0;
  for(let t=ph;t<o.length-2;t+=p,k++){
    const f=Math.round(t);let e=0;
    for(let d=-1;d<=1;d++){const i=f+d;if(i>=0&&i<o.length){const v=low[i]+0.5*o[i];if(v>e)e=v;}}
    sums[k%4]+=e;cnt[k%4]++;
  }
  const v=sums.map((s,q)=>cnt[q]?s/cnt[q]:0),mx=Math.max(...v);
  for(let q=0;q<4;q++) if(v[q]>=mx*0.97) return q;
  return 0;
}

function frameToTime(item,f){return f*item.hop/item.sr+item.tOff;}

function analyzeBuffer(buf){
  const sr=buf.sampleRate,N=FFT_N;
  const maxLen=Math.min(buf.length,Math.floor(sr*150));
  const a=buf.getChannelData(0),b=buf.numberOfChannels>1?buf.getChannelData(1):null;
  const hop=Math.round(sr/100),fps=sr/hop;
  const T=Math.floor((maxLen-N)/hop);
  if(T<500) throw new Error("Track is too short to analyze (need 5s+).");
  const binW=sr/N;
  const kLow=Math.max(2,Math.floor(150/binW)),kMid=Math.floor(3000/binW),kHigh=Math.min(N/2-1,Math.floor(8000/binW));
  const re=new Float32Array(N),im=new Float32Array(N),prev=new Float32Array(N/2);
  const lo=new Float32Array(T),mi=new Float32Array(T),hi=new Float32Array(T),lowE=new Float32Array(T);
  for(let t=0;t<T;t++){
    const s=t*hop;
    for(let i=0;i<N;i++){const v=b?(a[s+i]+b[s+i])*0.5:a[s+i];re[i]=v*FFT.win[i];im[i]=0;}
    fft(re,im);
    let l=0,m=0,h=0,e=0;
    for(let k=1;k<=kHigh;k++){
      const mag=Math.sqrt(re[k]*re[k]+im[k]*im[k]);
      const lm=Math.log1p(1000*mag/N);
      const d=lm-prev[k];
      if(t>0&&d>0){if(k<=kLow)l+=d;else if(k<=kMid)m+=d;else h+=d;}
      prev[k]=lm;
      if(k<=kLow) e+=mag/N;
    }
    lo[t]=l;mi[t]=m;hi[t]=h;lowE[t]=e;
  }
  const norm=(x)=>{let s=0;for(let i=0;i<x.length;i++)s+=x[i];const mu=s/x.length||1;for(let i=0;i<x.length;i++)x[i]/=mu;};
  norm(lo);norm(mi);norm(hi);norm(lowE);
  const raw=new Float32Array(T);
  for(let t=0;t<T;t++) raw[t]=1.0*lo[t]+0.7*mi[t]+0.3*hi[t];
  // subtract local mean, half-wave rectify
  const o=new Float32Array(T),W=Math.round(fps*0.4);
  const cum=new Float64Array(T+1);for(let t=0;t<T;t++)cum[t+1]=cum[t]+raw[t];
  let tot=0;
  for(let t=0;t<T;t++){
    const i0=Math.max(0,t-W),i1=Math.min(T,t+W+1);
    const avg=(cum[i1]-cum[i0])/(i1-i0);
    const v=raw[t]-avg;o[t]=v>0?v:0;tot+=o[t];
  }
  const om=tot/T||1;for(let t=0;t<T;t++)o[t]/=om;

  // coarse tempo sweep
  let best={sc:-1,bpm:120,ph:0};
  for(let bpm=60;bpm<=180;bpm+=0.25){
    const r=bestPhase(o,fps,bpm,false);
    const sc=r.score*prior(bpm);
    if(sc>best.sc) best={sc,bpm,ph:r.ph};
  }
  // fine refinement (no prior: prior only breaks octave ties)
  let fine={sc:-1,bpm:best.bpm,ph:best.ph};
  for(let bpm=best.bpm-0.4;bpm<=best.bpm+0.4;bpm+=0.02){
    const p=60/bpm*fps;
    for(let ph=best.ph-2;ph<=best.ph+2;ph+=0.25){
      let pp=ph;if(pp<0)pp+=p;if(pp>=p)pp-=p;
      const sc=combSum(o,p,pp);
      if(sc>fine.sc) fine={sc,bpm,ph:pp};
    }
  }
  const item={sr,hop,fps,tOff:(N/2)/sr-DELTA,env:o,low:lowE,kick:lo,snr:mi,hat:hi,duration:buf.duration};
  item.bpm=Math.round(fine.bpm*100)/100;
  const q=pickDownbeat(o,lowE,fps,item.bpm,fine.ph);
  const spb=60/item.bpm;
  item.fd=frameToTime(item,fine.ph)+q*spb;
  item.fd=normFd(item.fd,spb);
  return item;
}
function normFd(fd,spb){const bar=4*spb;fd=fd%bar;if(fd<0)fd+=bar;return fd;}

// refit grid for a manually-chosen tempo (half/double), reusing stored envelopes
function refit(item,bpm){
  if(!item.env){item.bpm=bpm;item.fd=0;return;}
  if(item.engine==="beat-this"){ // grid phase is already exact; only the bar length changes
    item.bpm=Math.round(bpm*100)/100;item.fd=normFd(item.fd,60/item.bpm);return;
  }
  const r1=bestPhase(item.env,item.fps,bpm,false);
  const p=60/bpm*item.fps;
  let bs=-1,bp=r1.ph;
  for(let ph=r1.ph-1.5;ph<=r1.ph+1.5;ph+=0.25){let pp=ph;if(pp<0)pp+=p;if(pp>=p)pp-=p;const sc=combSum(item.env,p,pp);if(sc>bs){bs=sc;bp=pp;}}
  const q=pickDownbeat(item.env,item.low,item.fps,bpm,bp);
  const spb=60/bpm;
  item.bpm=Math.round(bpm*100)/100;
  item.fd=normFd(frameToTime(item,bp)+q*spb,spb);
}

/* ================= FEEL: TRAP (HALF-TIME) VS BOOM BAP ================= */
// Both styles put a snare every 2 counts of SOME grid, so the tempo alone can't tell them apart:
//   boom bap ~80-100 BPM: kick on 1 and 3, snare on 2 and 4, hi-hats in 8ths (or 16ths) of that beat.
//   trap ~130-160 BPM, half-time: kick on 1, snare on 3, hi-hats in 16ths (plus rolls) of that beat.
// A trap beat counted at half speed (e.g. 70 instead of 140) looks like a slow boom bap: snare on "2 and 4" of the
// stretched grid. What gives it away is the hi-hats: at the half-speed grid they fill every 1/8 of a beat (they are
// 16ths of the real tempo), while a boom bap's hats leave the in-between 1/8 slots empty.
const FEEL_HAT_FILL=0.55;  // hats in the in-between 1/8-beat slots vs the on-grid 1/4 slots: above this = 16ths of double time
const FEEL_SNARE24=1.15;   // snare on beats 2+4 vs 1+3 of the bar
const FEEL_HAT8_MAX=0.3;   // hats on the off-beat 8ths vs on the beat: below this at a fast tempo = really half that tempo
// strongest value of an envelope within +-w frames of time t (s)
function envAt(it,arr,t,w){
  const f=Math.round((t-it.tOff)*it.fps);let m=0;
  for(let d=-w;d<=w;d++){const i=f+d;if(i>=0&&i<arr.length&&arr[i]>m)m=arr[i];}
  return m;
}
// average kick / snare strength on each beat of the bar, and hi-hat strength at each 1/8 of a beat, for grid {bpm, fd}
function grooveProfile(it,bpm,fd){
  const spb=60/bpm,end=Math.min(it.duration,150)-spb;
  const kick=[0,0,0,0],snr=[0,0,0,0],n=[0,0,0,0],hat=new Array(8).fill(0);
  for(let k=Math.ceil((it.tOff+0.05-fd)/spb);fd+k*spb<end;k++){
    const t=fd+k*spb,q=((k%4)+4)%4;
    kick[q]+=envAt(it,it.kick,t,2);snr[q]+=envAt(it,it.snr,t,2);n[q]++;
    for(let j=0;j<8;j++) hat[j]+=envAt(it,it.hat,t+j*spb/8,1);
  }
  for(let q=0;q<4;q++){kick[q]/=n[q]||1;snr[q]/=n[q]||1;}
  const on=hat[0]+hat[2]+hat[4]+hat[6],off=hat[1]+hat[3]+hat[5]+hat[7];
  return {kick,snr,
    hatFill:on?off/on:0,                                       // ~1 = hats on every 1/8 beat, ~0 = only on 1/4s
    hat8:hat[4]/(hat[0]||1e-6),                                // ~1 = hats on the off-beat 8ths too, ~0 = hats only on the beat
    snare24:(snr[1]+snr[3])/((snr[0]+snr[2])||1e-6),           // >1 = snare on 2 and 4
    snare3:snr[2]/(Math.max(snr[0],snr[1],snr[3])||1e-6)};     // >1 = snare on 3 only
}
// pick which beat is "1" for a half-time trap bar: kick on 1, snare on 3
function trapDownbeat(it){
  const spb=60/it.bpm,pr=grooveProfile(it,it.bpm,it.fd);
  let bq=0,bs=-1e9;
  for(let q=0;q<4;q++){const sc=pr.kick[q]+pr.snr[(q+2)%4]-0.5*pr.snr[q]-0.5*pr.kick[(q+2)%4];if(sc>bs){bs=sc;bq=q;}}
  it.fd=normFd(it.fd+bq*spb,spb);
}
function setTempo(it,bpm){
  if(it.kick) refit(it,bpm);
  else{it.bpm=Math.round(bpm*100)/100;it.fd=normFd(it.fd,60/it.bpm);}
}
// After detection: spot trap counted at half speed, fix the tempo, and put the snare on 3. Sets it.feel.
function checkFeel(it){
  if(!it.kick||!it.hat) return;
  let pr=grooveProfile(it,it.bpm,it.fd);
  it.feelFix=null;
  if(it.bpm<100&&it.bpm*2<=180&&pr.snare24>=FEEL_SNARE24&&pr.hatFill>=FEEL_HAT_FILL){
    setTempo(it,it.bpm*2);it.feelFix="doubled";
    pr=grooveProfile(it,it.bpm,it.fd);
  }
  // the opposite mistake: a slow boom bap counted at double speed has hats only on the beat and one snare per "bar"
  else if(it.bpm>=120&&it.bpm/2>=60&&pr.hat8<FEEL_HAT8_MAX&&pr.snare3>=1.1&&pr.snare24<0.5){
    setTempo(it,it.bpm/2);it.feelFix="halved";
    pr=grooveProfile(it,it.bpm,it.fd);
  }
  if(it.bpm>=110){
    trapDownbeat(it);pr=grooveProfile(it,it.bpm,it.fd);
    it.feel=pr.snare3>=1.1?"trap":null;
  }else it.feel=pr.snare24>=FEEL_SNARE24?"boombap":null;
}
// manual choice from the FEEL buttons
function setFeel(it,feel){
  if(feel==="trap"){
    if(it.bpm<100) setTempo(it,Math.min(260,it.bpm*2));
    if(it.kick) trapDownbeat(it);
  }else if(it.bpm>=110) setTempo(it,Math.max(40,it.bpm/2));
  it.feel=feel;it.feelFix="manual";
}

/* ================= DROP: WHERE THE FULL BEAT COMES IN ================= */
// Long intros: find where the drums come in for good, so playback starts PREP_BARS (8 beats) before it and bar 1 of
// the 32 lands on the drop. Works per beat (so a "1" that is off by a beat can't hide the step): each beat scores
// kick onsets + low-band energy + half-weighted hi-hat onsets, each scaled by its 75th percentile.
// "Full level" = the 75th percentile of 4-bar (16-beat) averages. The drop starts at the first beat j whose next
// 4 bars reach DROP_FULL x full, are DROP_JUMP x the 4 bars before, and with no 4-bar stretch before j above
// DROP_QUIET x full (so a song that starts full never gets a drop, and a later breakdown is never picked).
// The exact beat is the sharpest 4-beat step in the 8 beats from j (or the grid's bar line next to it, if nearly as sharp).
// anchor=true (fresh analysis): drops land on a "1", so the grid's downbeat moves onto the drop (as far as the groove allows).
// anchor=false (after hand edits / Auto): the grid stays, and the drop snaps to its nearest bar line.
// Stored as it.dropT (seconds); it.dropManual keeps a hand-set drop when the grid changes.
const DROP_FULL=0.7,DROP_JUMP=1.6,DROP_QUIET=0.65,DROP_WIN=16;
function beatScores(it){
  const spb=60/it.bpm,end=Math.min(it.duration,150),nb=Math.max(0,Math.floor((end-it.fd)/spb));
  const k=[],h=[],e=[];
  for(let b=0;b<nb;b++){
    const f0=Math.max(0,Math.round((it.fd+b*spb-it.tOff)*it.fps)),f1=Math.min(it.kick.length,Math.round((it.fd+(b+1)*spb-it.tOff)*it.fps));
    let sk=0,sh=0,se=0;for(let f=f0;f<f1;f++){sk+=it.kick[f];sh+=it.hat[f];se+=it.low[f];}
    const n=Math.max(1,f1-f0);k.push(sk/n);h.push(sh/n);e.push(se/n);
  }
  const p75=a=>{const v=a.slice().sort((x,y)=>x-y)[Math.floor(a.length*0.75)];return v>0?v:1;};
  const K=p75(k),H=p75(h),E=p75(e);
  return k.map((_,b)=>(k[b]/K+e[b]/E+0.5*h[b]/H)/2.5);
}
function detectDrop(it,anchor){
  it.dropManual=false;it.dropT=it.fd;
  if(!it.kick||!it.hat||!it.low) return;
  const s=beatScores(it),n=s.length,spb=60/it.bpm;
  const avg=(a,b)=>{let t=0,c=0;for(let i=Math.max(0,a);i<Math.min(n,b);i++){t+=s[i];c++;}return c?t/c:0;};
  if(n<DROP_WIN+1) return;
  const R=[];for(let i=0;i<=n-DROP_WIN;i++) R.push(avg(i,i+DROP_WIN));
  const full=R.slice().sort((a,b)=>a-b)[Math.floor(R.length*0.75)]||1;
  let maxBefore=0;   // loudest 4-bar stretch that ends at or before j
  for(let j=1;j<=n-DROP_WIN;j++){
    if(j>=DROP_WIN) maxBefore=Math.max(maxBefore,R[j-DROP_WIN]);
    // only a full 4-bar stretch counts as "already full": a single opening hit doesn't rule out a later drop
    if(maxBefore>DROP_QUIET*full) break;
    const after=R[j];
    if(after>=DROP_FULL*full&&after>=DROP_JUMP*avg(j-DROP_WIN,j)){
      const step=c=>avg(c,c+4)-avg(c-4,c);
      let best=j,bs=-1e9;
      for(let c=j;c<Math.min(j+8,n-4);c++){const d=step(c);if(d>bs){bs=d;best=c;}}
      // a fill or riser blurs the step: if the grid's own bar line is a beat away and nearly as sharp, keep it
      for(const c of [best-1,best+1]) if(c>0&&c%4===0&&step(c)>=0.8*bs){best=c;break;}
      // a recognized groove pins the grid's phase: trap (snare on 3) fixes the "1" outright; boom bap (kick on 1 and 3,
      // snare on 2 and 4) can't tell 1 from 3, so the drop may move the "1" by 2 beats but never by 1 (an odd step
      // is a fill or pickup: snap to the neighbouring bar line)
      if(anchor&&it.feel==="trap") best=Math.round(best/4)*4;
      else if(anchor&&it.feel==="boombap"&&best%2) best+=best%4===3?1:-1;
      const t=it.fd+best*spb;
      if(anchor){it.fd=normFd(t,spb);it.dropT=t;}
      else it.dropT=it.fd+Math.round(best/4)*4*spb;
      return;
    }
  }
}
// the drop on the current grid: its time and how many bars after the first downbeat it is
function dropInfo(it){
  if(it.builtin||it.dropT==null) return {t:it.fd,bar:0};
  const bar=240/it.bpm,b=Math.max(0,Math.round((it.dropT-it.fd)/bar));
  return {t:it.fd+b*bar,bar:b};
}
// after any tempo / downbeat change: find the drop again, or keep a hand-set one on the nearest bar line
function regridDrop(it){if(it.dropManual) it.dropT=dropInfo(it).t; else detectDrop(it,false);}

/* ================= BEAT THIS! (in-browser, ONNX) ================= */
// Beat This! (small) in-browser pipeline: mel spectrogram -> ONNX model -> peak picking.
// Matches CPJKU/beat_this: 22.05 kHz mono, 1024-pt FFT, hop 441, 128 Slaney mel bins 30-11000 Hz.
const BT = (() => {
  const SR = 22050, NFFT = 1024, HOP = 441, NMEL = 128, FMIN = 30, FMAX = 11000, FPS = 50;
  const hz2mel = f => { const fsp = 200 / 3, ml = 15, ls = Math.log(6.4) / 27; return f >= 1000 ? ml + Math.log(f / 1000) / ls : f / fsp; };
  const mel2hz = m => { const fsp = 200 / 3, ml = 15, ls = Math.log(6.4) / 27; return m >= ml ? 1000 * Math.exp(ls * (m - ml)) : m * fsp; };
  let fb = null, win = null, cosT = null, sinT = null, rev = null;
  function init() {
    if (fb) return;
    const nf = NFFT / 2 + 1;
    const mp = [], lo = hz2mel(FMIN), hi = hz2mel(FMAX);
    for (let i = 0; i < NMEL + 2; i++) mp.push(mel2hz(lo + (hi - lo) * i / (NMEL + 1)));
    fb = new Float32Array(NMEL * nf); // [mel][bin]
    for (let m = 0; m < NMEL; m++) {
      const d0 = mp[m + 1] - mp[m], d1 = mp[m + 2] - mp[m + 1];
      for (let k = 0; k < nf; k++) {
        const f = k * (SR / 2) / (nf - 1);
        const dn = -(mp[m] - f) / d0, up = (mp[m + 2] - f) / d1;
        fb[m * nf + k] = Math.max(0, Math.min(dn, up));
      }
    }
    win = new Float64Array(NFFT);
    for (let i = 0; i < NFFT; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / NFFT); // periodic Hann
    cosT = new Float64Array(NFFT / 2); sinT = new Float64Array(NFFT / 2);
    for (let i = 0; i < NFFT / 2; i++) { cosT[i] = Math.cos(2 * Math.PI * i / NFFT); sinT[i] = -Math.sin(2 * Math.PI * i / NFFT); }
    rev = new Uint16Array(NFFT);
    const bits = Math.log2(NFFT);
    for (let i = 0; i < NFFT; i++) { let r = 0; for (let b = 0; b < bits; b++) if (i & (1 << b)) r |= 1 << (bits - 1 - b); rev[i] = r; }
  }
  function fft(re, im) {
    for (let i = 0; i < NFFT; i++) { const j = rev[i]; if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
    for (let size = 2; size <= NFFT; size <<= 1) {
      const half = size >> 1, step = NFFT / size;
      for (let s = 0; s < NFFT; s += size) for (let k = 0, w = 0; k < half; k++, w += step) {
        const a = s + k, b = a + half;
        const tr = re[b] * cosT[w] - im[b] * sinT[w], ti = re[b] * sinT[w] + im[b] * cosT[w];
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
      }
    }
  }
  // samples: Float32Array mono at 22050 Hz -> Float32Array (frames x 128), row-major
  function logMel(x) {
    init();
    const nf = NFFT / 2 + 1, N = x.length, frames = 1 + Math.floor(N / HOP), pad = NFFT / 2;
    const norm = 1 / Math.sqrt(NFFT); // torchaudio normalized="frame_length"
    const out = new Float32Array(frames * NMEL), re = new Float64Array(NFFT), im = new Float64Array(NFFT), mag = new Float64Array(nf);
    const at = i => { // reflect padding like torch.stft(center=True)
      if (i < 0) i = -i; if (i >= N) i = 2 * (N - 1) - i;
      return i >= 0 && i < N ? x[i] : 0;
    };
    for (let f = 0; f < frames; f++) {
      const s = f * HOP - pad;
      for (let i = 0; i < NFFT; i++) { re[i] = at(s + i) * win[i]; im[i] = 0; }
      fft(re, im);
      for (let k = 0; k < nf; k++) mag[k] = Math.hypot(re[k], im[k]) * norm;
      for (let m = 0; m < NMEL; m++) {
        let a = 0; const o = m * nf;
        for (let k = 0; k < nf; k++) a += fb[o + k] * mag[k];
        out[f * NMEL + m] = Math.log1p(1000 * a);
      }
    }
    return { data: out, frames };
  }
  // Same chunking as beat_this.inference.split_piece / aggregate_prediction (keep_first)
  async function frameLogits(spect, runChunk, chunk = 1500, border = 6) {
    const T = spect.frames, step = chunk - 2 * border, starts = [];
    for (let s = -border; s < T - border; s += step) starts.push(s);
    if (T > step) starts[starts.length - 1] = T - (chunk - border);
    const beat = new Float32Array(T).fill(-1000), down = new Float32Array(T).fill(-1000);
    const preds = [];
    for (const s of starts) {
      const a = Math.max(s, 0), b = Math.min(s + chunk, T);
      const left = Math.max(0, -s), right = Math.max(0, Math.min(border, s + chunk - T));
      const L = left + (b - a) + right, buf = new Float32Array(L * NMEL);
      buf.set(spect.data.subarray(a * NMEL, b * NMEL), left * NMEL);
      preds.push(await runChunk(buf, L));
    }
    // earlier chunks win: write in reverse order
    for (let i = starts.length - 1; i >= 0; i--) {
      const s = starts[i], p = preds[i];
      for (let j = border; j < p.beat.length - border; j++) {
        const t = s + j; if (t < 0 || t >= T) continue;
        beat[t] = p.beat[j]; down[t] = p.down[j];
      }
    }
    return { beat, down };
  }
  function peaks(l) { // +-3 frame local max with logit > 0, adjacent peaks averaged
    const T = l.length, idx = [];
    for (let t = 0; t < T; t++) {
      if (!(l[t] > 0)) continue;
      let ok = true;
      for (let k = Math.max(0, t - 3); k <= Math.min(T - 1, t + 3); k++) if (l[k] > l[t]) { ok = false; break; }
      if (ok) idx.push(t);
    }
    const res = []; let p = idx[0], c = 1;
    for (let i = 1; i < idx.length; i++) {
      if (idx[i] - p <= 1) { c++; p += (idx[i] - p) / c; } else { res.push(p); p = idx[i]; c = 1; }
    }
    if (idx.length) res.push(p);
    return res;
  }
  function postprocess(beat, down) {
    const bt = peaks(beat).map(f => f / FPS);
    let db = peaks(down).map(f => f / FPS);
    if (bt.length) db = db.map(d => bt.reduce((best, b) => Math.abs(b - d) < Math.abs(best - d) ? b : best, bt[0]));
    db = [...new Set(db)].sort((a, b) => a - b);
    return { beats: bt, downbeats: db };
  }
  return { SR, HOP, NMEL, FPS, logMel, frameLogits, postprocess };
})();

/* ---- loading onnxruntime-web + the model (needs a normal web origin, e.g. GitHub Pages) ---- */
const ORT_BASE="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/";
const BT_MODEL="models/beat_this_small.onnx";
let btSession=null,btOrt=null,btLoading=null,btFailed=null;
function btLoad(){
  if(btSession) return Promise.resolve(btSession);
  if(btFailed) return Promise.reject(btFailed);
  if(!btLoading) btLoading=(async()=>{
    const ort=await import(ORT_BASE+"ort.min.mjs");
    ort.env.wasm.wasmPaths=ORT_BASE;ort.env.wasm.numThreads=1;ort.env.wasm.proxy=true; // proxy = run in a worker, UI stays responsive
    const r=await fetch(BT_MODEL);
    if(!r.ok) throw new Error("model file not found ("+r.status+")");
    btSession=await ort.InferenceSession.create(new Uint8Array(await r.arrayBuffer()),{executionProviders:["wasm"]});
    btOrt=ort;return btSession;
  })().catch(e=>{btFailed=e;btLoading=null;throw e;});
  return btLoading;
}
// decoded AudioBuffer -> mono 22.05 kHz Float32Array (first 150 s), downmix and resample by the browser
async function btMono(buf){
  const secs=Math.min(buf.duration,150),oc=new OfflineAudioContext(1,Math.ceil(secs*BT.SR),BT.SR);
  const s=oc.createBufferSource();s.buffer=buf;s.connect(oc.destination);s.start(0,0,secs);
  return (await oc.startRendering()).getChannelData(0);
}
// beats + downbeats (s) -> constant-tempo grid {bpm, fd}: robust line fit t = a + b*i, downbeat phase by vote
function btToGrid(beats,downbeats){
  if(beats.length<8) throw new Error("too few beats found");
  const iv=[];for(let i=1;i<beats.length;i++) iv.push(beats[i]-beats[i-1]);
  const P0=iv.slice().sort((x,y)=>x-y)[iv.length>>1];
  const idx=[0];for(let i=1;i<beats.length;i++) idx.push(idx[i-1]+Math.max(1,Math.round(iv[i-1]/P0))); // per-interval, so no drift build-up
  let a=beats[0],b=P0,keep=beats.map((_,i)=>i);
  for(let pass=0;pass<3;pass++){
    let n=keep.length,sx=0,sy=0,sxx=0,sxy=0;
    for(const i of keep){const x=idx[i],y=beats[i];sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;}
    const den=n*sxx-sx*sx;if(!den) break;
    b=(n*sxy-sx*sy)/den;a=(sy-b*sx)/n;
    keep=beats.map((_,i)=>i).filter(i=>Math.abs(beats[i]-(a+b*idx[i]))<0.15*b);
    if(keep.length<8) throw new Error("beats are not steady enough");
  }
  const votes=[0,0,0,0];
  for(const d of downbeats){const k=Math.round((d-a)/b);votes[((k%4)+4)%4]++;}
  let q=0;for(let k=1;k<4;k++) if(votes[k]>votes[q]) q=k;
  return {bpm:Math.round(60/b*100)/100,fd:normFd(a+q*b,b)};
}
async function analyzeBT(buf,onProg){
  const session=await btLoad();
  onProg&&onProg("Beat This! 0%");
  await new Promise(r=>setTimeout(r,0));
  const mel=BT.logMel(await btMono(buf));
  const total=Math.max(1,Math.ceil(mel.frames/1488));let done=0;
  const fl=await BT.frameLogits(mel,async(data,L)=>{
    const o=await session.run({spect:new btOrt.Tensor("float32",data,[1,L,BT.NMEL])});
    done++;onProg&&onProg("Beat This! "+Math.round(100*done/total)+"%");
    return {beat:o.beat.data,down:o.downbeat.data};
  });
  const pp=BT.postprocess(fl.beat,fl.down);
  return btToGrid(pp.beats,pp.downbeats);
}

function openDB(){
  return new Promise((res,rej)=>{
    try{
      const r=indexedDB.open("freestyle-beats",1);
      r.onupgradeneeded=()=>r.result.createObjectStore("beats",{keyPath:"id"});
      r.onsuccess=()=>res(r.result);

async function dbAll(){const db=await openDB();return new Promise((res,rej)=>{const q=db.transaction("beats").objectStore("beats").getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function dbPut(rec){if(!dbOK)return;try{const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction("beats","readwrite");tx.objectStore("beats").put(rec);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}catch(e){dbOK=false;}}
async function dbDel(id){if(!dbOK)return;try{const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction("beats","readwrite");tx.objectStore("beats").delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}catch(e){}}
function persist(it){
  dbPut({id:it.id,name:it.name,blob:it.blob,duration:it.duration,bpm:it.bpm,fd:it.fd,sr:it.sr,hop:it.hop,fps:it.fps,tOff:it.tOff,env:it.env,low:it.low,kick:it.kick,snr:it.snr,hat:it.hat,feel:it.feel,feelFix:it.feelFix,dropT:it.dropT,dropManual:it.dropManual,added:it.added,engine:it.engine});
}
async function loadLib(){
  try{
    const rows=await dbAll();
    rows.sort((x,y)=>x.added-y.added);
    LIB=rows.map(r=>({...r,status:"ready"}));
  }catch(e){dbOK=false;LIB=[];}
  try{const s=localStorage.getItem("fs-selected");if(s&&allItems().some(i=>i.id===s))SELECTED=s;}catch(e){}
  if(!SELECTED){const f=allItems().find(inTab);SELECTED=f?f.id:null;}
  const cur=selItem();if(cur&&cur.feel) LIB_TAB=cur.feel;   // open the tab the remembered beat lives in
  renderLib();

// beats saved before the trap/boom bap check: measure their kick/snare/hat bands once (keeps the tempo grid), then check
async function upgradeFeel(){
  for(const it of LIB){
    if(it.hat&&it.dropT===undefined){detectDrop(it,false);persist(it);renderLib();continue;}   // keep their grid
    if(it.hat||!it.blob) continue;
    try{
      const a=analyzeBuffer(await ensureBuf(it));
      Object.assign(it,{sr:a.sr,hop:a.hop,fps:a.fps,tOff:a.tOff,env:a.env,low:a.low,kick:a.kick,snr:a.snr,hat:a.hat});
      if(!it.engine) it.engine="builtin";
      checkFeel(it);detectDrop(it,false);persist(it);renderLib();
    }catch(e){}
    await new Promise(r=>setTimeout(r,30));
  }
}
function allItems(){return LIB.concat(DEFAULTS);}
function selItem(){return allItems().find(i=>i.id===SELECTED)||null;}
async function ensureBuf(it){
  if(BUF.has(it.id)) return BUF.get(it.id);
  if(!it._load) it._load=(async()=>{
    await null;   // let it._load be set before anything below re-enters ensureBuf
    let ab;
    if(it.blob) ab=await it.blob.arrayBuffer();
    else{   // default beat: fetch it from beats/ the first time it's used
      it.prog="loading...";renderLib();
      try{const r=await fetch(it.file);if(!r.ok) throw new Error("Could not load "+it.file);ab=await r.arrayBuffer();}
      finally{it.prog=null;}
    }
    const b=await getCtx().decodeAudioData(ab);
    BUF.set(it.id,b);
    if(!it.blob) renderLib();
    return b;
  })().finally(()=>{it._load=null;});
  return it._load;
}
// Beat This! frames are 20 ms; nudge the downbeat onto the nearest onset peak (+-30 ms) of the 10 ms envelope
function snapPhase(it,g){
  const p=60/g.bpm*it.fps,ph0=(g.fd-it.tOff)*it.fps;let best=-1,bd=0;
  for(let d=-3;d<=3;d+=0.25){const ph=(((ph0+d)%p)+p)%p,sc=combSum(it.env,p,ph);if(sc>best){best=sc;bd=d;}}
  return normFd((ph0+bd)/it.fps+it.tOff,60/g.bpm);
}
// try the Beat This! model; on any failure keep the built-in detector's grid
async function runBT(it,buf){
  it.engine="builtin";
  try{
    const g=await analyzeBT(buf,m=>{it.prog=m;renderLib();});
    it.bpm=g.bpm;it.fd=snapPhase(it,g);it.engine="beat-this";
  }catch(e){it.btErr=(e&&e.message)||String(e);}
  it.prog=null;
}
function fmtDur(s){const m=Math.floor(s/60),r=Math.floor(s%60);return m+":"+String(r).padStart(2,"0");}

async function addFiles(files){
  getCtx();
  for(const f of files){
    if(!/^audio\//.test(f.type)&&!/\.(mp3|wav|m4a|aac|ogg|flac|webm)$/i.test(f.name)) continue;
    const it={id:"b"+Date.now()+Math.random().toString(36).slice(2,6),name:f.name.replace(/\.[^.]+$/,""),blob:f,status:"analyzing",added:Date.now()};
    LIB.push(it);renderLib();
    await new Promise(r=>setTimeout(r,30));
    try{
      const buf=await getCtx().decodeAudioData(await f.arrayBuffer());
      BUF.set(it.id,buf);
      await new Promise(r=>setTimeout(r,10));
      Object.assign(it,analyzeBuffer(buf));   // built-in detector: always runs, keeps envelopes for the tempo buttons
      await runBT(it,buf);
      checkFeel(it);
      detectDrop(it,true);
      it.status="ready";
      persist(it);
      setSelected(it.id);if(it.feel) LIB_TAB=it.feel;   // jump to the new upload
    }catch(e){
      it.status="error";it.err=e.message||"Could not decode this file.";
    }
    renderLib();
  }
}

function inTab(it){return it.feel===LIB_TAB||(!it.isDefault&&!it.feel);}
function renderLib(){

    h+='<div class="lhdr">YOUR BEATS</div>';
    for(const it of mine){
      const meta=it.status==="analyzing"?(it.prog||"analyzing..."):it.status==="error"?"error":Math.round(it.bpm*10)/10+" BPM · "+(it.feel==="trap"?"trap · ":it.feel==="boombap"?"boom bap · ":"")+fmtDur(it.duration);
      h+='<div class="lrow'+(it.id===SELECTED?" sel":"")+'" data-id="'+it.id+'"><div class="lname">'+esc(it.name)+'</div><div class="lmeta">'+meta+'</div><button class="ldel" data-del="'+it.id+'" title="Remove">&#10005;</button></div>';

  for(const it of defs){
    const meta=it.prog||Math.round(it.bpm*10)/10+" BPM · "+(it.feel==="trap"?"trap · ":it.feel==="boombap"?"boom bap · ":"")+fmtDur(it.duration);

  }

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function renderDetail(){
  const it=selItem(),d=document.getElementById("detail");
  if(!it||it.status!=="ready"&&!it.builtin){d.hidden=true;return;}
  d.hidden=false;
  d.classList.toggle("ro",!!it.isDefault);   // default beats: show the grid, hide the edit buttons
  document.getElementById("bd-bpm").textContent=it.bpm.toFixed(1);
  document.getElementById("row-offset").style.display=it.builtin||it.isDefault?"none":"flex";
  document.getElementById("grid-cv").style.display=it.builtin?"none":"block";
  if(!it.builtin) drawGrid(it);

async function drawGrid(it){
  const cv=document.getElementById("grid-cv");
  let buf;try{buf=await ensureBuf(it);}catch(e){return;}
  if(selItem()!==it) return;
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;
  const g=cv.getContext("2d");g.scale(dpr,dpr);g.clearRect(0,0,w,h);
  const spb=60/it.bpm,bar=4*spb,span=Math.min(buf.duration,bar*8+spb),drop=dropInfo(it).t;
  const t0=Math.max(0,drop-PREP_BARS*bar-spb);
  const data=buf.getChannelData(0),sr=buf.sampleRate;
  g.fillStyle="#4d4d4d";
  for(let x=0;x<w;x++){
    const s0=Math.floor((t0+span*x/w)*sr),s1=Math.floor((t0+span*(x+1)/w)*sr);
    let mx=0;for(let i=s0;i<s1&&i<data.length;i+=4){const v=Math.abs(data[i]);if(v>mx)mx=v;}
    const hh=Math.min(1,mx)*h*0.9;g.fillRect(x,(h-hh)/2,1,hh);
  }
  // prep bars shaded; bar numbers count from the drop (= bar 1), prep bars are P1 and P2
  const px0=Math.max(0,(drop-PREP_BARS*bar-t0)/span*w),px1=(drop-t0)/span*w;
  g.fillStyle="rgba(255,164,43,.08)";g.fillRect(px0,0,px1-px0,h);
  g.font="bold 11px Fraunces, Georgia, serif";
  for(let k=Math.ceil((t0-it.fd)/spb);it.fd+k*spb<t0+span;k++){
    const t=it.fd+k*spb,x=(t-t0)/span*w,down=((k%4)+4)%4===0;
    const j=Math.round((t-drop)/bar),isDrop=down&&j===0;
    g.fillStyle=isDrop?"#ffa42b":down?"#1ed760":"rgba(255,255,255,.3)";
    g.fillRect(Math.round(x),0,down?3:1,h);
    if(down){
      g.fillStyle=isDrop?"#ffa42b":"#ffffff";
      const lbl=isDrop?"1 DROP":j>0?String(j+1):j>=-PREP_BARS?"P"+(PREP_BARS+j+1):"";
      if(lbl) g.fillText(lbl,x+5,12);
    }
  }
}

/* ================= PLAYER ================= */
const P={timer:null,src:null,t0:0,spb:0,last:-1,nextIdx:0,cb:null,click:false};
function clickAt(time,accent){
  const ac=getCtx(),o=ac.createOscillator(),g=ac.createGain();
  o.connect(g);g.connect(ac.destination);
  o.frequency.value=accent?1100:760;
  g.gain.setValueAtTime(0.0001,time);
  g.gain.exponentialRampToValueAtTime(accent?0.35:0.2,time+0.002);
  g.gain.exponentialRampToValueAtTime(0.001,time+0.06);
  o.start(time);o.stop(time+0.07);
}
async function startPlayer(it,opts){
  stopPlayer();
  const ac=getCtx();
  let buf=null;
  if(!it.builtin) buf=await ensureBuf(it);
  P.spb=60/it.bpm;P.cb=opts.onBeat;P.click=!!opts.click;P.last=-1;P.nextIdx=0;P.countIn=0;
  P.t0=ac.currentTime+0.25;
  if(buf){
    // prep beat 1 = PREP_BARS before the drop, so bar 1 lands on it; the loop repeats from the drop, never the intro
    const bar=4*P.spb,drop=dropInfo(it).t,start=drop-PREP_BARS*bar;
    const bars=Math.floor((buf.duration-drop)/bar);
    const src=ac.createBufferSource();src.buffer=buf;
    if(bars>=1){src.loop=true;src.loopStart=drop;src.loopEnd=drop+bars*bar;}
    src.connect(ac.destination);P.src=src;
    if(start>=0) src.start(P.t0,start);
    else{src.start(P.t0-start,0);P.countIn=Math.ceil(-start/P.spb-0.02);}   // drop too early for 8 beats: click count-in
  }
  P.timer=setInterval(playerTick,20);
}
function playerTick(){
  const ac=AC;if(!ac) return;
  const now=ac.currentTime;
  while(P.t0+P.nextIdx*P.spb<now+0.1){
    if(P.click||P.nextIdx<P.countIn) clickAt(P.t0+P.nextIdx*P.spb,P.nextIdx%4===0);
    P.nextIdx++;
  }
  const idx=Math.floor((now-P.t0)/P.spb);
  while(P.last<idx){P.last++;if(P.last>=0&&P.cb)P.cb(P.last);}
}
function stopPlayer(){
  if(P.timer){clearInterval(P.timer);P.timer=null;}
  if(P.src){try{P.src.stop();}catch(e){}try{P.src.disconnect();}catch(e){}P.src=null;}
  P.cb=null;
}
function resetDots(){
  document.querySelectorAll("#dots .dot").forEach(d=>d.className="dot");
  const b=document.getElementById("prev-btn");if(b)b.innerHTML="&#9654; Preview";
}
let previewing=false;
async function togglePreview(){
  const it=selItem();if(!it) return;
  if(previewing){previewing=false;stopPlayer();resetDots();return;}
  previewing=true;
  document.getElementById("prev-btn").innerHTML="&#9632; Stop";
  await startPlayer(it,{click:true,onBeat:(i)=>{
    const dots=document.querySelectorAll("#dots .dot");
    dots.forEach((d,n)=>d.className="dot"+(n===i%4?(n===0?" on one":" on"):""));
  }});
}

// RHYME2-END
// rhyme-group colors: Spotify green, warning orange, announcement blue, negative pink, then lavender and white
const GROUP_COLORS=["#1ed760","#ffa42b","#539df5","#f3727f","#b49bc8","#ffffff"];
function gColor(g){return GROUP_COLORS[g%GROUP_COLORS.length];}
function gLetter(g){return String.fromCharCode(65+g);}
// Preset schemes. Column schemes: one letter per bar, same letter = same rhyme, _ = no rhyme; the rhyme column can be
// dragged to any beat. Two-beat schemes: per bar, the beat-2 letter then the beat-4 letter (lowercase = beat 2,
// UPPERCASE = beat 4), written for 2 bars; bars 3-4 repeat the pattern with fresh rhymes. Fixed on beats 2 and 4.
// Only the first four show until "more" is pressed.
const SCHEMES={AABB:"AABB",AAAA:"AAAA",ABAB:"ABAB",AA_A:"AA_A",A_A_:"A_A_",aAaA:["aA","aA"],aAbB:["aA","bB"],aBaB:["aB","aB"],aA_A:["aA","_A"],_AaA:["_A","aA"]};
const MAIN_SCHEMES=["AABB","AAAA","ABAB","AA_A"];
const isColumnScheme=k=>typeof SCHEMES[k]==="string";
const canDrag=()=>G.kind==="preset"&&MAIN_SCHEMES.includes(G.scheme);
let MORE_OPEN=false;
let G={kind:"preset",scheme:"AABB",vis:"all",multi:false,rhymeCol:3,custom:null,running:false,curGlobalBeat:-1};
try{G.multi=localStorage.getItem("fs-syl")==="2";}catch(e){}
let SAVED=[];
try{SAVED=JSON.parse(localStorage.getItem("fs-schemes")||"[]");if(!Array.isArray(SAVED))SAVED=[];}catch(e){SAVED=[];}
function persistSaved(){try{localStorage.setItem("fs-schemes",JSON.stringify(SAVED));return true;}catch(e){return false;}}
function clone(o){return JSON.parse(JSON.stringify(o));}

function presetGroups(){
  const pat=SCHEMES[G.scheme],groups=new Map();
  const add=(key,r,c)=>{if(!groups.has(key)) groups.set(key,[]);groups.get(key).push({r,c});};
  if(isColumnScheme(G.scheme)){
    const c=canDrag()?G.rhymeCol:3;
    [...pat].forEach((ch,r)=>{if(ch!=="_") add(ch,r,c);});
  }else{
    for(let r=0;r<4;r++){
      const pair=pat[r%2],block=r<2?"":"'";   // bars 3-4: same shape, new rhymes
      [...pair].forEach((ch,i)=>{if(ch!=="_") add(ch.toUpperCase()+block,r,i?3:1);});
    }
  }
  // "Show words": all, or only the first / last box of each rhyme group (reading order)
  return [...groups.values()].map(cells=>({...(G.multi?{multi:true}:{}),cells:cells.map((x,i)=>({r:x.r,c:x.c,
    show:G.vis==="all"||(G.vis==="first"?i===0:i===cells.length-1)}))}));
}
function activeGroups(){return G.kind==="custom"?G.custom.groups:presetGroups();}
function schemeName(){return G.kind==="custom"?G.custom.name:G.scheme;}
// r*4+c -> {g,pos,show}; pos numbers a group's cells in reading order
function cellMap(groups){
  const m=new Map();
  groups.forEach((gr,g)=>gr.cells.slice().sort((a,b)=>a.r-b.r||a.c-b.c).forEach((cl,pos)=>m.set(cl.r*4+cl.c,{g,pos,show:cl.show,multi:!!gr.multi,n:gr.cells.length})));
  return m;
}
// 2-syllable groups pick from BANK2 families big enough for the group (up to 6 distinct words)
const BANK2_MIN=[0,1,2,3,4,5,6].map(k=>BANK2.filter(f=>f.length>=k));
// Every PLAY re-rolls the words: a shuffled family order per bank (no family repeats until the bank runs out)
// plus a random rotation inside each family, so a 2-cell group isn't always a family's two most common words.
// The rotation stays within the family's group-size + 2 most common words (families are sorted by frequency).
let RND=null;
function shuffled(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rerollWords(){RND={b1:shuffled(BANK.length),b2:BANK2_MIN.map(f=>shuffled(f.length)),rot:Math.floor(Math.random()*1e6)};}
rerollWords();
function wordFor(info,block,ng){
  const slot=block*ng+info.g;let fam,k;
  if(info.multi){const need=Math.min(info.n,6),ord=RND.b2[need];k=ord[slot%ord.length];fam=BANK2_MIN[need][k];}
  else{k=RND.b1[slot%BANK.length];fam=BANK[k];}
  const w=Math.min(fam.length,info.n+2);
  return fam[(info.pos+RND.rot+k*7)%w];
}

function renderSetup(){
  const chip=(s,extra)=>'<div class="spill'+(extra?" xtra":"")+(G.kind==="preset"&&G.scheme===s?" sel":"")+'" data-s="'+s+'">'+s+'</div>';
  // first row never changes: the four main schemes and the more / < chip in the same spot
  document.getElementById("scheme-pills").innerHTML=MAIN_SCHEMES.map(s=>chip(s,false)).join("")
    +'<div class="spill more" data-more="'+(MORE_OPEN?"0":"1")+'" title="'+(MORE_OPEN?"Fewer schemes":"More schemes")+'">'+(MORE_OPEN?"&lt;":"more")+'</div>';
  document.getElementById("scheme-more").innerHTML=MORE_OPEN?Object.keys(SCHEMES).filter(s=>!MAIN_SCHEMES.includes(s)).map(s=>chip(s,true)).join(""):"";
  let h="";
  for(const s of SAVED) h+='<div class="spill'+(G.kind==="custom"&&G.custom.id===s.id?" sel":"")+'" data-saved="'+s.id+'">'+esc(s.name)+'<span class="x" data-delsaved="'+s.id+'" title="Delete saved scheme">&#10005;</span></div>';
  if(G.kind==="custom"&&!G.custom.id) h+='<div class="spill sel">'+esc(G.custom.name)+'</div>';
  document.getElementById("saved-pills").innerHTML=h;
  const preset=G.kind==="preset";
  document.getElementById("vis-col").classList.toggle("off",!preset);   // stays in place; custom schemes set these in Build
  const syl=document.getElementById("syl-main");syl.classList.toggle("sel",G.multi);syl.setAttribute("aria-pressed",String(G.multi));
  document.querySelectorAll("#vis-pills .vpill").forEach(p=>p.classList.toggle("sel",p.dataset.v===G.vis));
  buildSetupGrid();
}
function buildSetupGrid(){
  const grid=document.getElementById("setup-grid"),wrap=document.getElementById("grid-wrap");
  grid.innerHTML="";wrap.querySelector(".rhyme-col")?.remove();
  const groups=activeGroups(),m=cellMap(groups),layer=canDrag();
  const box=cls=>{const d=document.createElement("div");d.className=cls;return d;};
  const rhymeCell=info=>{
    const cell=box("gcell rc"+(info.show?"":" hid"));cell.style.setProperty("--gc",gColor(info.g));
    const wt=document.createElement("div"),w=wordFor(info,0,groups.length);
    wt.className="word-text"+(info.show?"":" hidden-word")+(w.length>7?" long":"");wt.textContent=w;cell.appendChild(wt);
    return cell;
  };
  // draggable schemes draw only empty boxes here; their rhyme column is a separate layer on top
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){const info=layer?null:m.get(r*4+c);grid.appendChild(info?rhymeCell(info):box("gcell"));}
  const hint=document.getElementById("col-hint");
  hint.hidden=!layer;hint.classList.remove("away");document.getElementById("grid-panel").classList.toggle("has-hint",layer);
  if(!layer){colDragStart=null;return;}
  const col=box("rhyme-col");col.style.setProperty("--col",G.rhymeCol);
  for(let r=0;r<4;r++){const info=m.get(r*4+G.rhymeCol);col.appendChild(info?rhymeCell(info):box("gcell slot"));}
  wrap.appendChild(col);
  placeHint();
  setupDrag(col);
}
// centre the drag hint under the rhyme column (offsets, so it is right even while the page is scaled by an animation)
function placeHint(){
  const wrap=document.getElementById("grid-wrap"),col=wrap.querySelector(".rhyme-col"),hint=document.getElementById("col-hint");
  if(!col||hint.hidden) return;
  // keep the capsule inside the panel; its pointer tip still sits over the column
  const panelW=document.getElementById("grid-panel").clientWidth,half=hint.offsetWidth/2,centre=wrap.offsetLeft+col.offsetLeft+col.offsetWidth/2;
  const left=Math.max(half+8,Math.min(panelW-half-8,centre));
  hint.style.left=left+"px";hint.style.setProperty("--tip",(centre-left)+"px");
}
// Dragging the rhyme column. It glides after the pointer through magnetic detents (it holds near each column, then
// slides quickly across the gap to the next) with resistance past the ends, and on release eases into the nearest
// column: no lean, no wobble, no overshoot. One animation loop and one state per column, so grabbing it again before
// it has settled carries on from where it is instead of starting a second, competing animation.
function setupDrag(col){
  const hint=document.getElementById("col-hint"),grid=document.getElementById("setup-grid");
  const st={base:G.rhymeCol,x:0,target:0,dragging:false,raf:0,x0:0,grab:0,last:0};
  const pitch=()=>grid.children[1].offsetLeft-grid.children[0].offsetLeft;
  const detent=raw=>{
    const p=pitch(),lo=-st.base*p,hi=(3-st.base)*p;
    if(raw<lo) return lo+(raw-lo)*0.2;
    if(raw>hi) return hi+(raw-hi)*0.2;
    const n=Math.round(raw/p),d=raw-n*p,h=p/2;
    return n*p+Math.sign(d)*h*Math.pow(Math.abs(d)/h,2.2);
  };
  const nearest=()=>Math.max(0,Math.min(3,st.base+Math.round(st.x/pitch())));
  const light=t=>[...grid.children].forEach((g,i)=>g.classList.toggle("target",st.dragging&&t!==st.base&&i%4===t));
  const frame=now=>{
    const dt=Math.min(50,now-(st.last||now)||16.7);st.last=now;
    const ease=1-Math.pow(1-(st.dragging?0.32:0.2),dt/16.7);   // exponential glide: smooth, never overshoots
    st.x+=(st.target-st.x)*ease;
    col.style.transform="translateX("+st.x.toFixed(2)+"px)";
    if(st.dragging) light(nearest());
    if(!st.dragging&&Math.abs(st.target-st.x)<0.35){   // settled: make the new column the layout position
      const dest=nearest();
      st.raf=0;st.last=0;st.x=0;st.target=0;st.base=dest;G.rhymeCol=dest;
      col.style.transform="";col.style.setProperty("--col",dest);
      placeHint();hint.classList.remove("away");
      return;
    }
    st.raf=requestAnimationFrame(frame);
  };
  const run=()=>{if(!st.raf) st.raf=requestAnimationFrame(frame);};
  let moved=0,fromHint=false,hintSide=0;
  const move=e=>{moved=Math.max(moved,Math.abs(e.clientX-st.x0));st.target=detent(st.grab+e.clientX-st.x0);};
  const up=()=>{
    document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
    st.dragging=false;col.classList.remove("dragging");light(-1);
    // a tap (no drag) on the hint's left or right half steps the column one beat that way
    const dest=fromHint&&moved<5?Math.max(0,Math.min(3,st.base+hintSide)):nearest();
    st.target=(dest-st.base)*pitch();run();
  };
  const start=(e,onHint)=>{
    if(e.button>0||st.dragging) return;
    e.preventDefault();
    fromHint=onHint;moved=0;
    if(onHint){const r=hint.getBoundingClientRect();hintSide=e.clientX<r.left+r.width/2?-1:1;}
    st.dragging=true;st.x0=e.clientX;st.grab=st.x;st.target=st.x;
    col.classList.add("dragging");hint.classList.add("away");
    document.addEventListener("pointermove",move);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
    run();
  };
  col.addEventListener("pointerdown",e=>start(e,false));
  colDragStart=e=>start(e,true);   // the drag hint can grab the column too
}

function builtGroups(){return B.groups.filter(g=>g.cells.length).map(g=>({cells:g.cells.map(c=>({r:c.r,c:c.c,show:c.show})),...(g.multi?{multi:true}:{})}));}
function removeGroup(g){
  B.groups.splice(g,1);

  if(B.active>g||B.active>=B.groups.length) B.active=Math.max(0,B.active-1);

const PREP_BARS=2,TOTAL_BARS=32;
function build32Bars(){
  const scroll=document.getElementById("bars-scroll");scroll.innerHTML="";
  const groups=activeGroups(),m=cellMap(groups),ng=groups.length;
  for(let bar=0;bar<PREP_BARS+TOTAL_BARS;bar++){
    const isPrep=bar<PREP_BARS,realBar=bar-PREP_BARS;
    const block=document.createElement("div");block.className="bar-block";block.id="barblock-"+bar;
    const row=document.createElement("div");row.className="bar-row-perf";
    for(let beat=0;beat<4;beat++){
      const cell=document.createElement("div");cell.className="pcell"+(isPrep?" prep-cell":" upcoming");cell.id="pc-"+bar+"-"+beat;
      const wd=document.createElement("div");wd.className="pword";
      const info=isPrep?null:m.get((realBar%4)*4+beat);
      if(info){
        const w=wordFor(info,Math.floor(realBar/4),ng);
        wd.textContent=info.show?w:"";wd.dataset.word=w;wd.dataset.shouldshow=info.show?"1":"0";
        cell.classList.add("rhyme-cell");cell.style.setProperty("--gc",gColor(info.g));
      }
      cell.appendChild(wd);row.appendChild(cell);
    }
    block.appendChild(row);scroll.appendChild(block);
  }
}
async function startPerf(){
  const it=selItem();if(!it) return;

  document.getElementById("p-beat-name").textContent=it.name.length>22?it.name.slice(0,21)+"…":it.name;
  document.getElementById("stop-btn").innerHTML="&#9632; STOP";

  ps.style.setProperty("--ox",(r.left+r.width/2)+"px");ps.style.setProperty("--oy",(r.top+r.height/2)+"px");
  document.getElementById("bars-scroll").scrollTop=0;

  catch(e){document.getElementById("p-beat-name").textContent="Could not play this file";}

function handleBeat(globalBeat){
  const totalCells=(PREP_BARS+TOTAL_BARS)*4;
  if(globalBeat>=totalCells){
    stopPlayer();
    document.getElementById("stop-btn").innerHTML="&#8592; BACK";   // 32 bars done
    document.getElementById("pause-btn").disabled=true;
    return;
  }
  const bar=Math.floor(globalBeat/4),beat=globalBeat%4;
  if(G.curGlobalBeat>=0){
    const prev=document.getElementById("pc-"+Math.floor(G.curGlobalBeat/4)+"-"+(G.curGlobalBeat%4));
    if(prev){
      prev.classList.remove("current-rhyme","current-beat");prev.classList.add("played");
      const pw=prev.querySelector(".pword");
      if(pw&&pw.dataset.word) pw.textContent=pw.dataset.shouldshow==="1"?pw.dataset.word:"";
    }
  }
  G.curGlobalBeat=globalBeat;
  const cell=document.getElementById("pc-"+bar+"-"+beat);
  if(cell){
    cell.classList.remove("upcoming","prep-cell","played");
    cell.classList.add(cell.classList.contains("rhyme-cell")?"current-rhyme":"current-beat");
    const pw=cell.querySelector(".pword");if(pw&&pw.dataset.word) pw.textContent=pw.dataset.word;
    const block=document.getElementById("barblock-"+bar),sc=document.getElementById("bars-scroll");
    if(block){const bR=block.getBoundingClientRect(),sR=sc.getBoundingClientRect();
      if(bR.bottom>sR.bottom-40||bR.top<sR.top+10) block.scrollIntoView({behavior:"smooth",block:"nearest"});}
  }
}
// Pause suspends the audio context: the beat, the clicks and the clock (beats are read from AudioContext.currentTime)

/* ================= INTRO: CARVED OUT, ASSEMBLED, TEXT WRITTEN IN ================= */
// On every load the page is carved out: each container and button has its outline drawn on and is then filled in, the
// small pieces (beat dots, the checkbox, the drag arrows) fly in and lock into place, the waveform is wiped on, and all
// text is written in letter by letter (the football explainer's writing: an SVG copy of each word laid over it, each
// letter's outline stroked on and then inked in; words start 1/60 s apart, letters 14 ms apart). Staggered from the
// top left; anything inside a container starts once that container's outline is under way.
let INTRO=false,INTRO_PENDING=false;
const SVGNS="http://www.w3.org/2000/svg";
const CARVE_SEL=".panel,.drop,.gcell,.btn,.spill,.vpill,.tab,.play-btn,.lrow.sel,.col-hint";
const ASSEMBLE_SEL=".dot,.chk input,.col-hint .ar";
const TEXT_SEL=".topbar .brand,.panel-title,.lbl,.spill,.vpill,.beat-lbl,.word-text,.col-hint,.btn,.tab,.lhdr,.lname,.lmeta,.lempty,.dlbl,.bpmv,.muted,.chk,.play-btn";
function introDelay(el,y0){const r=el.getBoundingClientRect();return Math.min(1300,Math.round(40+(r.top-y0)*0.45+r.left*0.1));}
// draw a rounded-rect outline over el (its own border box) and return the overlay
function carveOutline(el,d){
  const cs=getComputedStyle(el),w=el.offsetWidth,h=el.offsetHeight;if(!w||!h) return null;
  if(cs.position==="static"){el.style.position="relative";el.dataset.carvePos="1";}
  const bl=parseFloat(cs.borderLeftWidth)||0,bt=parseFloat(cs.borderTopWidth)||0;
  const r=Math.min(parseFloat(cs.borderTopLeftRadius)||0,h/2,w/2);
  // outline colour: green for green buttons, else the element's own border colour, else a soft white
  const bg=cs.backgroundColor,bc=cs.borderTopColor;
  const alpha=(m=>m?parseFloat(m[1]):1)(/rgba\([^)]*,\s*([\d.]+)\)/.exec(bc));   // very faint borders draw in soft white
  const stroke=/30, 215, 96|29, 185, 84/.test(bg)?"#1ed760":(bt>0&&alpha>=0.3?bc:"rgba(255,255,255,.32)");
  const g=document.createElementNS(SVGNS,"svg");g.setAttribute("class","carve-svg");g.setAttribute("width",w);g.setAttribute("height",h);
  g.style.left=-bl+"px";g.style.top=-bt+"px";g.setAttribute("aria-hidden","true");
  const rect=document.createElementNS(SVGNS,"rect");
  rect.setAttribute("x",.75);rect.setAttribute("y",.75);rect.setAttribute("width",Math.max(0,w-1.5));rect.setAttribute("height",Math.max(0,h-1.5));rect.setAttribute("rx",Math.max(0,r-.75));
  rect.style.stroke=stroke;rect.style.setProperty("--len",Math.ceil(2*(w+h)-(8-2*Math.PI)*r)+2);rect.style.setProperty("--d",d+"ms");
  g.append(rect);el.append(g);
  return g;
}
// wrap every word of el's text in <span class="w"><span class="wt">word</span></span>
function wrapWords(el){
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];
  while(walker.nextNode()){const n=walker.currentNode;if(/\S/.test(n.nodeValue)&&!n.parentElement.closest(".w,svg,canvas,input"))nodes.push(n);}
  for(const n of nodes){
    const frag=document.createDocumentFragment();
    for(const part of n.nodeValue.split(/(\s+)/)){
      if(!part) continue;
      if(/^\s+$/.test(part)){frag.append(part);continue;}
      const w=document.createElement("span");w.className="w";const t=document.createElement("span");t.className="wt";t.textContent=part;w.append(t);frag.append(w);
    }
    n.replaceWith(frag);
  }
  return [...el.querySelectorAll(".w")];
}
// lay an SVG copy over a word, one <text> per letter at the exact spot the word puts it, each set to draw at d0+
function writeWord(w,d0){
  const box=w.getBoundingClientRect();if(!box.width) return 0;
  const probe=document.createElement("span");probe.style.cssText="display:inline-block;width:0;height:0;vertical-align:baseline";
  w.firstChild.append(probe);const base=probe.getBoundingClientRect().top-box.top;probe.remove();
  const size=parseFloat(getComputedStyle(w).fontSize),text=w.firstChild.textContent;
  const g=document.createElementNS(SVGNS,"svg");g.setAttribute("width",box.width);g.setAttribute("height",box.height);g.setAttribute("aria-hidden","true");w.append(g);
  const whole=document.createElementNS(SVGNS,"text");whole.setAttribute("x",0);whole.setAttribute("y",base);whole.textContent=text;g.append(whole);
  const letters=[...text].map((ch,i)=>({ch,x:whole.getStartPositionOfChar(i).x,wd:whole.getExtentOfChar(i).width}));
  whole.remove();
  let last=d0;
  letters.forEach((l,j)=>{
    if(!/\S/.test(l.ch)) return;
    const t=document.createElementNS(SVGNS,"text");t.setAttribute("x",l.x);t.setAttribute("y",base);t.textContent=l.ch;
    t.style.setProperty("--len",Math.ceil(4*(l.wd+size*0.8)+10));
    const d=d0+j*14;last=Math.max(last,d);t.style.setProperty("--d",d+"ms");g.append(t);
  });
  w.classList.add("writing");
  return last;
}
async function runIntro(){
  const done=()=>{document.body.classList.remove("preintro");INTRO=false;if(INTRO_PENDING){INTRO_PENDING=false;renderLib();}};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){done();return;}
  try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]);}catch(e){}
  INTRO=true;
  const scope=[document.querySelector("#root > .topbar"),document.getElementById("setup-screen")];
  const vis=el=>el.offsetParent!==null||getComputedStyle(el).position==="fixed";
  const all=sel=>scope.flatMap(r=>[...r.querySelectorAll(sel)]).filter(vis);
  const carves=all(CARVE_SEL);
  const y0=Math.min(...scope.map(r=>r.getBoundingClientRect().top));
  // each container starts no earlier than 180 ms after the container around it
  const delays=new Map();
  for(const el of carves){
    let d=introDelay(el,y0);
    const host=el.parentElement.closest(CARVE_SEL);if(host&&delays.has(host)) d=Math.max(d,delays.get(host)+180);
    delays.set(el,d);
  }
  const hostDelay=el=>{const h=el.closest(CARVE_SEL);return h&&delays.has(h)?delays.get(h):introDelay(el,y0);};
  let end=0;
  // writing first (it measures the words), then outlines, assembly and the waveform wipe
  const texts=all(TEXT_SEL).filter(el=>!el.parentElement.closest(TEXT_SEL));
  for(const el of texts){
    const start=hostDelay(el)+260;
    wrapWords(el).forEach((w,i)=>{end=Math.max(end,writeWord(w,start+Math.round(i*1000/60)));});
  }
  const svgs=[],root=document.getElementById("root");
  // empty everything instantly: with transitions on, the finished page would visibly fade away before the drawing starts
  root.classList.add("notrans");
  for(const [el,d] of delays){
    const g=carveOutline(el,d);if(g) svgs.push(g);   // reads the element's real colours, so before it is emptied
    el.classList.add("carving");
    setTimeout(()=>el.classList.remove("carving"),d+700);   // the outline is drawn: fill it in
    if(g) setTimeout(()=>g.classList.add("done"),d+1050);   // then let the drawn line fade into the real border
    end=Math.max(end,d+1150);
  }
  void root.offsetWidth;
  root.classList.remove("notrans");
  for(const el of delays.keys()) el.classList.add("carved");   // the fill-in transition, from here on
  const rnd=(a,b)=>(a+Math.random()*(b-a)).toFixed(1);
  for(const el of all(ASSEMBLE_SEL)){
    const d=hostDelay(el)+300;
    el.style.setProperty("--d",d+"ms");el.style.setProperty("--ax",rnd(-18,18)+"px");el.style.setProperty("--ay",rnd(-14,14)+"px");el.style.setProperty("--ar",rnd(-25,25)+"deg");
    el.classList.add("assemble");end=Math.max(end,d+700);
  }
  for(const el of all(".gv")){const d=hostDelay(el)+200;el.style.setProperty("--d",d+"ms");el.classList.add("wipe");end=Math.max(end,d+900);}
  document.body.classList.remove("preintro");
  // hand everything back to plain markup once it is all drawn, filled and inked
  setTimeout(()=>{
    document.querySelectorAll(".w").forEach(w=>w.replaceWith(w.firstChild.textContent));
    svgs.forEach(g=>g.remove());
    document.querySelectorAll("[data-carve-pos]").forEach(el=>{el.style.position="";delete el.dataset.carvePos;});
    document.querySelectorAll(".carving,.carved").forEach(el=>el.classList.remove("carving","carved"));
    document.querySelectorAll(".assemble,.wipe").forEach(el=>{el.classList.remove("assemble","wipe");["--d","--ax","--ay","--ar"].forEach(v=>el.style.removeProperty(v));});
    done();
  },end+700);
}

/* ================= INIT ================= */
renderSetup();
renderLib();
loadLib().then(runIntro,runIntro);
window.addEventListener("resize",()=>{placeHint();const it=selItem();if(it&&!it.builtin&&!document.getElementById("detail").hidden)drawGrid(it);});
</script>
